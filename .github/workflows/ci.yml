name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter doodleui-react test:coverage

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter doodleui-react build
      - run: pnpm --filter doodleui-react size:check

  visual-regression:
    name: Chromatic
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/doodle-ui
          buildScriptName: build-storybook
          exitZeroOnChanges: true
      - name: Build Storybook (no Chromatic token)
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: pnpm --filter doodleui-react build-storybook

  cross-pm-compatibility:
    name: Cross-PM (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn-classic, yarn-berry, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack (Yarn Berry)
        if: matrix.pm == 'yarn-berry' || matrix.pm == 'yarn-classic'
        run: |
          corepack enable
          if [ "${{ matrix.pm }}" = "yarn-berry" ]; then
            corepack prepare yarn@4.6.0 --activate
          else
            corepack prepare yarn@1.22.22 --activate
          fi
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter doodleui-react build
      - name: Pack tarball
        id: pack
        run: |
          TARBALL=$(cd packages/doodle-ui && npm pack --pack-destination ../.. | tail -n 1)
          echo "tarball=${PWD}/${TARBALL}" >> "$GITHUB_OUTPUT"
      - name: Run smoke test
        run: |
          node scripts/test-pm-consumer.mjs --pm ${{ matrix.pm }} --tarball "${{ steps.pack.outputs.tarball }}"
